<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Popup Practice</title>
</head>
<body>
    <h1>Popup Window Practice</h1>
    <p> Click the button to open another page.</p>
    <button 
        id = "open-popup"
        onclick="window.open(
            'https://example.com',
            '_blank',
            'width=500,height=500'
        )"
    >   
        Open Popup
    </button>
</body>
